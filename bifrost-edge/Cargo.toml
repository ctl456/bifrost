[package]
name = "bifrost-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP edge: routing, limits and the streaming proxy path"

[dependencies]
axum = "0.8.9"
bifrost-audit = { workspace = true }
bifrost-config = { workspace = true }
bifrost-core = { workspace = true }
bifrost-fingerprint = { workspace = true }
bifrost-protocol = { workspace = true }
bifrost-wire = { workspace = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { workspace = true }
serde_json = { workspace = true }
time.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "signal", "io-util", "macros"] }
