# The three gates a change has to pass, run where nobody has to remember them.
#
# They are the same three the section in README.md names, in the same order, and
# they are the whole of what a green mark means here: one machine's
# `cargo test --workspace && cargo clippy --workspace --all-targets -- -D warnings
# && cargo fmt --all --check` is this file. `--locked` is added, so a change that
# needed a dependency to move and did not carry the lock file with it fails here
# rather than on the machine that pulls it.
#
# The check that lives outside the test suite is not in this job, and cannot be:
# `tools/smoke.sh` needs the key a real login writes and spends a turn, and what it
# checks is a running deployment rather than a diff. It is what to run before
# installing a build, and its `--self-test` is what to run when you doubt it.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A test that fails should say which assertion failed, not which escape codes
  # the terminal it is not attached to did not understand.
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The channel and the components come from rust-toolchain.toml, so the
      # runner uses the same toolchain declaration a laptop does. This step only
      # installs it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: The source is formatted the way `cargo fmt` would write it
        run: cargo fmt --all --check

      - name: No lint fires
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Every test passes
        run: cargo test --workspace --locked
