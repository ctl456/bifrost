# The image: whether it builds, and where it is published.
#
# Two questions asked at different times, so two jobs. A pull request asks whether the
# Dockerfile still works, and that is answered on the architecture the runner already
# is with nothing pushed anywhere — the arm64 half of a release is built under
# emulation, and there is no reason to pay for that to answer a question about a diff.
# A tag, or a manual run, asks for a release, and that one is published for both
# architectures: the other one is what a laptop on Apple Silicon needs, and a local
# gateway is what this is.
#
# Nothing here runs a test. The gates on the source are `ci.yml`'s, and a tag is
# expected to point at a commit main already carries. What this workflow checks is the
# packaging — `cargo build --locked` inside the image is what makes a dependency that
# moved without the lock file fail here rather than on someone's machine, and the last
# step of the first job is the only check anywhere that a running container answers.
#
# The two secrets a deployment needs are not here: a key arrives per request, and the
# GITHUB_TOKEN below is for the registry rather than for Command Code.

name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A superseded build of the same ref is not worth finishing: the emulated half of a
# release is the most expensive thing this repository runs.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every pull request and every push to main: the image builds, and is not pushed.
  #
  # A tag and a manual run are the publish job's, in both directions: neither should
  # also build the amd64 image on its own, and a dispatch from main is the way to say
  # "publish what is there now" rather than "build it twice".
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # `load` because the next step runs it: an image that built and was thrown away
      # would not have answered whether the thing it produces works.
      - name: The image builds for the architecture this runner is
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: bifrost:check
          push: false
          load: true
          # `mode=max` exports the intermediate stages, which is the whole point of
          # building the dependencies in a layer of their own: with the default it is
          # only the final image that is cached, and the compiler runs again anyway.
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build

      # The one check that says the image works rather than that it was produced. The
      # binary answers /health without a key, so nothing has to be configured for this
      # — which is the same property a deployment has, on the defaults a container gets
      # with no arguments.
      #
      # The probe is read out of the image and run against the container that is
      # serving it, rather than waited for: what needs checking is the command the
      # image declares, and Docker's interval is not part of the question.
      - name: The image serves, and the probe it declares gets an answer
        run: |
          set -euo pipefail
          docker run --rm --detach --name bifrost-check --publish 3050:3050 bifrost:check
          trap 'docker stop bifrost-check >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 20); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3050/health; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent --show-error http://127.0.0.1:3050/health; then
            echo "the container did not answer; it said:" >&2
            docker logs bifrost-check >&2
            exit 1
          fi

          probe=$(docker inspect --format '{{index .Config.Healthcheck.Test 1}}' bifrost-check)
          echo "the probe the image declares: $probe"
          docker exec bifrost-check /bin/sh -c "$probe"

          echo "the counts it serves: $(curl --fail --silent http://127.0.0.1:3050/status)"

  # A tag or a manual run: both architectures, published to GHCR.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 is built on an amd64 runner, so the whole stage — including the C crypto
      # library aws-lc-sys compiles — runs under emulation. QEMU is what makes that
      # possible and the cache at the bottom is what makes it affordable.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag says what was asked for. A `v*` tag publishes the version it names and
      # moves `latest`; a manual run from main publishes `edge`. Every image also
      # carries `sha-<commit>`, which is the tag to name in a report — it is the only
      # one that cannot move between two builds of the same source.
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read what the build job wrote and write under a scope of its own, so that
          # the half of this release that CI already compiled is not compiled again,
          # and the arm64 layers cannot evict the ones a pull request depends on.
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=publish
