[workspace]
members = [
    "bifrost-core",
    "bifrost-config",
    "bifrost-audit",
    "bifrost-fingerprint",
    "bifrost-wire",
    "bifrost-protocol",
    "bifrost-edge",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
bifrost-audit = { version = "0.1.0", path = "bifrost-audit" }
bifrost-config = { version = "0.1.0", path = "bifrost-config" }
bifrost-core = { version = "0.1.0", path = "bifrost-core" }
bifrost-fingerprint = { version = "0.1.0", path = "bifrost-fingerprint" }
bifrost-wire = { version = "0.1.0", path = "bifrost-wire" }
bifrost-protocol = { version = "0.1.0", path = "bifrost-protocol" }
bifrost-edge = { version = "0.1.0", path = "bifrost-edge" }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
toml = "0.9.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
