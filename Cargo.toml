[package]
name = "bifrost"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "A local gateway that puts Command Code's own API behind the OpenAI, Anthropic and Responses protocols"

[dependencies]
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "signal", "io-util", "macros"] }
toml = "0.9.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
